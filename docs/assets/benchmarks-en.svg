<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="920" viewBox="0 0 1120 920" role="img" aria-labelledby="title desc" xml:lang="en">
<title id="title">OpenCode Live Compact: Aider and Web-Bench side by side</title>
<desc id="desc">Aider passed 150/150 in both with 3.1% lower estimated cost. Web-Bench passed 20/20 stages and 59/59 final tests in both with 42.1% lower estimated cost. Web-Bench pause benefit is inconclusive because Original OpenCode never compacted natively.</desc>
<style>text{font-family:Consolas,SFMono-Regular,Liberation Mono,Noto Sans SC,Microsoft YaHei,monospace;font-variant-numeric:tabular-nums}</style>
<rect x="0.5" y="0.5" width="1119" height="919" fill="#0b0b0b" stroke="#292929"/>
<text x="28" y="34" font-size="18" fill="#ededed" >opencode / live compact</text>
<text x="1092" y="34" font-size="14" fill="#969696" text-anchor="end">OpenCode 2.2.6 / GPT-6 Luna / 2026.11.09</text>
