<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="920" viewBox="0 0 1120 920" role="img" aria-labelledby="title desc" xml:lang="zh-CN">
<title id="title">OpenCode Live Compact：Aider 与 Web-Bench 并列对比</title>
<desc id="desc">Aider 两组通过150/150，Live Compact估算费用降低12.3%。Web-Bench两组完成20/20，最终测试59/59，估算费用降低42.1%；原版没有触发原生压缩，暂停收益尚无结论。</desc>
